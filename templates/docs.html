<!doctype html>
<html lang="pt-BR" data-theme="light" data-site-root="{{SITE_ROOT}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="theme-color" content="#EF362A">
  <title>{{PAGE_TITLE}} — Documentação Coral</title>
  <link rel="icon" type="image/svg+xml" href="{{SITE_ROOT}}assets/icons/favicon.svg">
  <link rel="stylesheet" href="{{SITE_ROOT}}assets/css/styles.css">
  <script>(function(){if(location.protocol==='file:'){var c=document.createElement('link');c.rel='stylesheet';c.href='{{SITE_ROOT}}assets/css/fontes-embutidas.css';document.head.append(c);return;}var f=document.createElement('link');f.rel='stylesheet';f.href='{{SITE_ROOT}}assets/css/fontes-arquivo.css';document.head.append(f);['{{SITE_ROOT}}assets/fonts/atkinsonhyperlegible-normal-400.woff2','{{SITE_ROOT}}assets/fonts/fraunces-normal-500-900.woff2'].forEach(function(h){var l=document.createElement('link');l.rel='preload';l.as='font';l.type='font/woff2';l.crossOrigin='anonymous';l.href=h;document.head.append(l);});})();</script>
  <script defer src="{{SITE_ROOT}}docs/dados/indice_busca.js"></script>
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Coral">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="{{PAGE_TITLE}} — Documentação Coral">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:image" content="{{SITE_ROOT}}assets/images/compartilhar.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}} — Documentação Coral">
  <meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_ROOT}}assets/images/compartilhar.png">
</head>
<body class="docs-body">
<a class="skip-link" href="#conteudo-docs">Pular para o conteúdo</a>
<header class="site-header">
  <div class="container header-inner">
    <div class="header-actions docs-mobile-actions">
      <button class="menu-button" type="button" data-docs-menu-toggle aria-expanded="false">Menu</button>
    </div>
    <a class="brand" href="{{HOME_HREF}}" aria-label="Coral, página inicial">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-name">Coral</span>
    </a>
    <div class="header-actions">
      <button class="search-trigger" type="button" data-search-open aria-label="Buscar na documentação">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.7"/><path d="M11 11l3.4 3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Buscar na documentação</span>
        <kbd aria-hidden="true">/</kbd>
      </button>
      <button class="icon-button" type="button" data-theme-toggle>Tema escuro</button>
    </div>
  </div>
</header>
<div class="docs-backdrop"></div>
<div class="docs-layout">
  <nav class="docs-sidebar" aria-label="Documentação">
    <a class="docs-home-link" href="{{DOCS_HOME_HREF}}">Visão geral da documentação</a>
    <div class="docs-version-box">
      <span>Runtime</span><strong data-version-key="coral">{{RUNTIME_VERSION}}</strong>
      <span>VS Code</span><strong data-version-key="extensao_vscode">{{EXTENSION_VERSION}}</strong>
      <span>Livro</span><strong data-version-key="livro">{{BOOK_EDITION}}</strong>
    </div>
    {{NAVIGATION}}
  </nav>

  <main class="docs-main" id="conteudo-docs">
    <div class="page-hero docs-page-hero">
      <div class="breadcrumb">Documentação / {{PAGE_GROUP}}</div>
      <h1>{{PAGE_TITLE}}</h1>
      <p>{{PAGE_DESCRIPTION}}</p>
      <div class="search-status" data-search-status aria-live="polite"></div>
    </div>
    <article class="docs-section">
      {{CONTENT}}
    </article>
    {{PREV_NEXT}}
  </main>

  <aside class="toc" id="toc-pagina" aria-label="Nesta página">
    <h4>Nesta página</h4>
    <ul>{{TOC}}</ul>
  </aside>
</div>
<button class="toc-fab" type="button" data-toc-toggle aria-controls="toc-pagina" aria-expanded="false">Nesta página</button>
<script defer src="{{SITE_ROOT}}assets/js/site.js"></script>
</body>
</html>
